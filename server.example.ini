# ─── Name Generator Web App ─────────────────────────────────────────────
# python -m pipeworks_name_generation.webapp.server --config server.ini
[webapp]
# Host interface to bind. Keep localhost for local-only use.
host = 127.0.0.1

# Optional manual port. Set a number (for example 8000) to pin the port.
# Leave blank to auto-select the first free port in 8000-8099, then 8100-8999.
port =

# SQLite database file path (relative or absolute).
db_path = pipeworks_name_generation/data/name_packages.sqlite3

# SQLite favorites database file path (relative or absolute).
favorites_db_path = pipeworks_name_generation/data/user_favorites.sqlite3

# Optional path to write full database exports (leave blank to disable).
db_export_path =

# Optional path to write database backups (leave blank to use timestamped backups).
db_backup_path =

# Set false to reduce console output.
verbose = true

# When false, serve API routes only (no UI/static assets).
serve_ui = true

# Set true to force API-only mode (overrides serve_ui).
api_only = false

# ─── Build Tools Web App ────────────────────────────────────────────────
# python -m build_tools.syllable_walk_web --config server.ini
[build_tools]
# Base directory for pipeline run discovery (corpus output).
output_base = _working/output

# Run discovery directory for Patch A.
# The dropdown will list all pipeline runs found in this directory.
# Leave blank to use output_base.
corpus_dir_a =

# Run discovery directory for Patch B.
# Leave blank to use output_base.
corpus_dir_b =

# Optional manual port. Leave blank to auto-select.
port =

# Set false to reduce console output.
verbose = true
